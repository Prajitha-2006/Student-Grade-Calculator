
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Grade Calculator</h1>
        <p>Enter your marks to calculate your grade</p>

        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="Enter your name">

        <label>Subject 1</label>
        <input type="number" id="mark1" placeholder="Enter marks (0-100)">

        <label>Subject 2</label>
        <input type="number" id="mark2" placeholder="Enter marks (0-100)">

        <label>Subject 3</label>
        <input type="number" id="mark3" placeholder="Enter marks (0-100)">

        <button onclick="calculateGrade()">Calculate Grade</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
